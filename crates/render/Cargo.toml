[package]
name = "sloppy-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sloppy Tanks renderer: handwritten WGSL drawn through WebGPU (wgpu), or WebGL2 (glow) as the fallback"

[lib]
# The crate has no doc examples, so `cargo test` skips the empty rustdoc pass.
doctest = false

[features]
# A browser build names its graphics backend; neither is a default, so native builds
# (the tests, and the desktop app's `native`) compile no browser backend. `webgpu`
# draws with wgpu on the browser's WebGPU.
webgpu = ["wgpu/webgpu"]
# The WebGL2 fallback: its own backend on glow (`gpu/webgl/`) and no wgpu, drawing the
# GLSL ES the build translated from the WGSL (`shader/tables.rs`). Wins over `webgpu`
# when both are enabled.
webgl = ["dep:glow"]
# The desktop builds: wgpu on Metal or Direct3D 12 in a native window, the
# texture files decoded here and canvas text drawn with the system's fonts.
native = ["dep:wgpu", "dep:image", "dep:tiny-skia", "dep:ab_glyph", "specializer"]
# Assemble each shader variant from the WGSL templates when a pipeline first asks for
# it (`shader/assembly.rs`). The desktop apps and the engine build (fixtures, labs)
# do; the page's shell does not: it reads the variants the build generated
# (`shader/tables.rs`) and carries neither the specializer nor the WGSL.
specializer = []
# The `shader-tables` generator `scripts/build-wasm.mjs` runs before a page build:
# every variant either backend can ask for, translated for WebGL with naga.
shader-tables = ["specializer", "dep:naga", "dep:serde_json"]

[[bin]]
name = "shader-tables"
required-features = ["shader-tables"]

[dependencies]
sloppy-core.workspace = true
glam.workspace = true
bytemuck.workspace = true
naga = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# wgpu only in the browser's WebGPU build (`webgpu`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "HtmlCanvasElement",
  "console",
  "Window",
  "Response",
  "Blob",
  "ImageBitmap",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "ImageData",
  "WebGl2RenderingContext",
  "Event",
  "EventTarget",
  "Performance",
] }

# Optional natively, so native test builds, which never draw, compile no wgpu.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, optional = true, features = ["std", "parking_lot", "metal", "dx12"] }
image = { version = "0.25", optional = true, default-features = false, features = ["webp"] }
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std", "simd"] }
ab_glyph = { version = "0.2", optional = true }

[dev-dependencies]
# Validates every generated WGSL variant natively, and translates it to the GLSL ES
# the WebGL build hands the browser; browsers still compile the result.
naga.workspace = true
serde_json.workspace = true
