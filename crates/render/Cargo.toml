[package]
name = "sloppy-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sloppy Tanks renderer: handwritten WGSL drawn through WebGPU (wgpu), or WebGL2 (glow) as the fallback"

[lib]
# The crate has no doc examples, so `cargo test` skips the empty rustdoc pass.
doctest = false

[features]
default = ["webgpu"]
webgpu = ["wgpu?/webgpu"]
# The WebGL2 fallback: its own backend on glow (`gpu/webgl/`), with the WGSL
# translated to GLSL ES by naga. Wins over `webgpu` when both are enabled.
webgl = ["dep:glow", "dep:naga"]
# The desktop builds: wgpu on Metal, Direct3D 12 or Vulkan in a native window, the
# texture files decoded here and canvas text drawn with the system's fonts.
native = ["dep:wgpu", "dep:image", "dep:tiny-skia", "dep:ab_glyph"]

[dependencies]
sloppy-core.workspace = true
glam.workspace = true
bytemuck.workspace = true
naga = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true }
glow = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "HtmlCanvasElement",
  "HtmlImageElement",
  "console",
  "Window",
  "Response",
  "Blob",
  "ImageBitmap",
  "ImageBitmapOptions",
  "ImageOrientation",
  "PremultiplyAlpha",
  "ColorSpaceConversion",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "ImageData",
  "WebGl2RenderingContext",
  "Event",
  "EventTarget",
  "Performance",
] }

# Optional natively, so native test builds, which never draw, compile no wgpu.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, optional = true, features = ["std", "parking_lot", "metal", "dx12", "vulkan"] }
image = { version = "0.25", optional = true, default-features = false, features = ["webp"] }
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std", "simd"] }
ab_glyph = { version = "0.2", optional = true }

[dev-dependencies]
# Validates every generated WGSL variant natively, and translates it to the GLSL ES
# the WebGL build hands the browser; browsers still compile the result.
naga.workspace = true
