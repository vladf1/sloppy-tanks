[package]
name = "sloppy-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sloppy Tanks renderer: WebGPU through wgpu, direct WebGL2 through glow, shared WGSL"

[features]
default = ["webgpu"]
webgpu = ["dep:wgpu", "wgpu/webgpu"]
# Direct WebGL2, with instance records in a texture because WebGL2 has no
# storage buffers (`gpu/gl/instance_store.rs`). Wins over
# `webgpu` when both are enabled.
webgl = ["dep:glow", "dep:naga"]

[dependencies]
sloppy-core.workspace = true
glam.workspace = true
bytemuck.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, optional = true }
glow = { version = "=0.17.0", optional = true }
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out"], optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlContextEvent",
  "EventTarget",
  "console",
  "Window",
  "Response",
  "Blob",
  "ImageBitmap",
  "ImageBitmapOptions",
  "ImageOrientation",
  "PremultiplyAlpha",
  "ColorSpaceConversion",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "ImageData",
] }

[dev-dependencies]
# Validates every generated WGSL variant natively, and translates it to the GLSL ES
# the WebGL build hands the browser; browsers still compile the result.
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out"] }
