[package]
name = "sloppy-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sloppy Tanks WebGPU renderer: wgpu with handwritten WGSL"

[dependencies]
sloppy-core.workspace = true
glam.workspace = true
bytemuck.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "HtmlCanvasElement",
  "console",
  "Window",
  "Response",
  "Blob",
  "ImageBitmap",
  "ImageBitmapOptions",
  "PremultiplyAlpha",
  "ColorSpaceConversion",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "ImageData",
] }

[dev-dependencies]
# Validates every generated WGSL variant natively; browsers still compile the result.
naga = { version = "=30.0.1", features = ["wgsl-in"] }
