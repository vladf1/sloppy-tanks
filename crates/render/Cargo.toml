[package]
name = "sloppy-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sloppy Tanks WebGPU (and WebGL2 fallback) renderer: wgpu with handwritten WGSL"

[features]
default = ["webgpu"]
webgpu = ["wgpu/webgpu"]
# The WebGL2 fallback: wgpu's GL backend, with the instance records in a texture
# because WebGL2 has no storage buffers (`gpu/instance_store.rs`). Wins over
# `webgpu` when both are enabled.
webgl = ["wgpu/webgl"]

[dependencies]
sloppy-core.workspace = true
glam.workspace = true
bytemuck.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "HtmlCanvasElement",
  "console",
  "Window",
  "Response",
  "Blob",
  "ImageBitmap",
  "ImageBitmapOptions",
  "ImageOrientation",
  "PremultiplyAlpha",
  "ColorSpaceConversion",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "ImageData",
] }

[dev-dependencies]
# Validates every generated WGSL variant natively, and translates it to the GLSL ES
# the WebGL build hands the browser; browsers still compile the result.
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out"] }
