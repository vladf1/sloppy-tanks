[package]
name = "sloppy-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sloppy Tanks game rules, simulation, models and replication shared by the browser and the server"

[lib]
# The crate has no doc examples, so `cargo test` skips the empty rustdoc pass.
doctest = false

[dependencies]
rapier3d.workspace = true
glam.workspace = true
serde.workspace = true
bytemuck.workspace = true
serde_json.workspace = true

[lints.rust]
# `--cfg sloppy_geometry_only` compiles only the model builders whose output the page
# caches (`geometrySources` in `scripts/content-version.mjs`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sloppy_geometry_only)"] }
