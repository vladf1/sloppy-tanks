[package]
name = "sloppy-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sloppy Tanks for macOS, Windows and iPad: the game in a native window, no browser"

[[bin]]
name = "sloppy-tanks"
path = "src/main.rs"

[dependencies]
sloppy-core.workspace = true
sloppy-render = { workspace = true, features = ["native"] }
sloppy-web = { path = "../web", default-features = false, features = ["native"] }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
winit = "0.30"
pollster = "0.4"
egui = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["links"] }
egui-wgpu = { version = "0.37", default-features = false }
kira = { version = "0.12", default-features = false, features = ["cpal", "mp3"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

# iOS has no clipboard arboard can reach (it would build its Linux backend there).
[target.'cfg(not(target_os = "ios"))'.dependencies]
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
