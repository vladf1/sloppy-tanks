[package]
name = "sloppy-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sloppy Tanks for macOS and Windows: the game in a native window, no browser"

[[bin]]
name = "sloppy-tanks"
path = "src/main.rs"

[dependencies]
sloppy-core.workspace = true
sloppy-render = { workspace = true, features = ["native"] }
sloppy-web = { path = "../web", default-features = false, features = ["native"] }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
winit = "0.30"
pollster = "0.4"
egui = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
egui-wgpu = { version = "0.37", default-features = false }
kira = { version = "0.12", default-features = false, features = ["cpal", "mp3"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
