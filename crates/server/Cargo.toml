[package]
name = "sloppy-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native multiplayer server: HTTP, WebSocket rooms and authoritative simulation"

[lib]
# The crate has no doc examples, so `cargo test` skips the empty rustdoc pass.
doctest = false

# The binary only parses settings and starts the server; its tests live in the library.
[[bin]]
name = "sloppy-server"
path = "src/main.rs"
test = false

[dependencies]
sloppy-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
flate2.workspace = true
sha1_smol.workspace = true
getrandom.workspace = true
libc.workspace = true
rustls.workspace = true
rustls-rustcrypto.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
# Masks offensive player names; its word lists stay out of the page's Wasm.
# `customize` adds the ordinary names its exceptions miss.
rustrict = { version = "0.7.39", default-features = false, features = ["censor", "customize"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# An independent WebSocket client, so end-to-end tests do not only check the codec
# against itself.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
