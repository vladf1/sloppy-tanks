[package]
name = "sloppy-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Browser entry points: the game loop, input commands and network state exposed to the page"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The development labs (`RenderLab`, `EffectsLab`) for tools/*-lab.html. Production
# builds leave them out; `pnpm run wasm -- --labs` builds them.
labs = []

[dependencies]
sloppy-core.workspace = true
sloppy-render.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "console", "Window", "Performance", "Storage"] }
