[package]
name = "sloppy-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Browser entry points: the game loop, input commands and network state exposed to the page"

[lib]
crate-type = ["cdylib", "rlib"]
# The crate has no doc examples, so `cargo test` skips the empty rustdoc pass.
doctest = false

[features]
# A browser build names its graphics backend (`scripts/build-wasm.mjs`): `webgpu`, or
# `webgl` for the WebGL2 engine. Neither is a default, so the native tests and the
# desktop app's `native` compile no browser backend.
webgpu = ["sloppy-render/webgpu"]
webgl = ["sloppy-render/webgl"]
# The development labs (`RenderLab`, `EffectsLab`) for tools/*-lab.html. Production
# builds leave them out; `pnpm run wasm -- --labs` builds them.
labs = []
# `Game` and `NetGame` as plain Rust for the desktop shell (`crates/desktop`), drawing
# with the renderer's native wgpu.
native = ["sloppy-render/native"]

[dependencies]
sloppy-core.workspace = true
sloppy-render.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "Window", "Performance", "Storage"] }
