# The quality gate, `pnpm run check`, split into parallel jobs. Each job runs one of
# the scripts `check` chains, so the two cannot drift apart. Pull requests run it
# directly; the Pages workflow calls it with the production site settings and deploys
# only after every job here passes. Beside the gate scripts, the server-image job publishes
# the multiplayer server's Docker image, which the Pages workflow promotes to :production.
name: Code quality

on:
  pull_request:
  workflow_call:
    inputs:
      deploy-base:
        description: Build the site with this DEPLOY_BASE and upload it as the Pages artifact.
        type: string
        default: ""
      multiplayer-url:
        description: VITE_MULTIPLAYER_URL for the Pages build.
        type: string
        default: ""
      build-number:
        description: >-
          The Pages workflow's run number, which the page and the server image report as
          their build. Pull requests have none.
        type: string
        default: ""
    outputs:
      server-image:
        description: >-
          The server image this commit built or found, tagged with its server build and
          site build.
        value: ${{ jobs.server-image.outputs.image }}

permissions:
  contents: read

jobs:
  site:
    name: Site (format, Wasm, types, Vite, lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: site
          wasm-bindgen: "true"
      # Pull requests have no inputs, so these are empty, which every reader treats as unset.
      - run: pnpm run check:site
        env:
          DEPLOY_BASE: ${{ inputs.deploy-base }}
          VITE_MULTIPLAYER_URL: ${{ inputs.multiplayer-url }}
          SLOPPY_BUILD_NUMBER: ${{ inputs.build-number }}
      # The server's own copy of the page (scripts/server-site.mjs), from the same Wasm:
      # built for the site root and joining the server that serves it, whatever the
      # Pages inputs. The server-image job ships it.
      - run: pnpm run server:build-site
      - uses: actions/upload-artifact@v7
        with:
          name: server-site
          path: dist-server
          retention-days: 7
      - if: inputs.deploy-base
        uses: actions/configure-pages@v6
      - if: inputs.deploy-base
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  clippy:
    name: Rust format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: clippy
      - run: pnpm run check:rust-lint

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: rust-tests
      - run: pnpm run test:rust

  # Builds the static musl server binary once: the page-shell tests drive it, and the
  # server image (Dockerfile) copies it in.
  server:
    name: Server build and page-shell tests
    runs-on: ubuntu-24.04
    env:
      SLOPPY_SERVER_VPS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: server-image
      # Kache restores the optimized server binary (about 50 s to link) when its inputs are
      # unchanged; the Cargo cache keeps only dependencies. The store is keyed by the server
      # build, so it is saved once per new server and an exact hit saves nothing. GC bounds
      # what the next save carries, since no Kache daemon runs here to do it.
      - name: Fingerprint the server build
        id: server-build
        run: >-
          node --input-type=module -e "import { serverBuild } from './scripts/content-version.mjs';
          console.log('hash=' + (await serverBuild()))" >> "$GITHUB_OUTPUT"
      - name: Restore the Kache store
        id: kache-store
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/kache
          key: kache-server-build-${{ steps.server-build.outputs.hash }}
          restore-keys: kache-server-build-
      - uses: kunobi-ninja/kache-action@v1
        with:
          version: 1.0.0
          cache-dir: ${{ runner.temp }}/kache
          github-cache: false
          cache-executables: true
          max-size: 150MiB
          pr-comment: false
      - run: pnpm run check:server
      - name: Trim the Kache store
        if: steps.kache-store.outputs.cache-hit != 'true'
        run: '"$RUSTC_WRAPPER" gc --max-age 7d'
      - name: Save the Kache store
        if: steps.kache-store.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/kache
          key: ${{ steps.kache-store.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: server-binary
          path: target/x86_64-unknown-linux-musl/server/sloppy-server
          retention-days: 7

  # The server image: the binary the server job built and tested, and the page copy the
  # site job built. It is pushed as <server build>-<site build>, plus pr-<number> for a
  # pull request, or main and sha-<commit> for main. An image the registry already holds
  # is only retagged, after main's first build of it stamps its build number
  # (scripts/build-server-image.mjs). Nothing here moves :production or touches a server;
  # fork pull requests, which cannot push, only build.
  server-image:
    name: Server image
    needs: [site, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      SERVER_IMAGE: ghcr.io/vladf1/sloppy-tanks-server
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
      # Node runs the image script, and the server build it names the image by comes
      # from `cargo tree`; nothing compiles here.
      - uses: ./.github/actions/setup
        with:
          cargo-cache: image
      - uses: actions/download-artifact@v8
        with:
          name: server-site
          path: dist-server
      - uses: actions/download-artifact@v8
        with:
          name: server-binary
          path: target/x86_64-unknown-linux-musl/server
      # Artifacts do not keep the executable bit.
      - run: chmod +x target/x86_64-unknown-linux-musl/server/sloppy-server
      - name: Log in to the GitHub Container Registry
        if: env.PUSH == 'true'
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: Build and push the server image
        id: image
        run: |
          if [ "$EVENT" = pull_request ]; then
            tags=(--tag "pr-$PR_NUMBER")
          else
            tags=(--tag main --tag "sha-${GITHUB_SHA::12}")
          fi
          push=()
          if [ "$PUSH" = true ]; then push=(--push); fi
          number=()
          if [ -n "$BUILD_NUMBER" ]; then number=(--build-number "$BUILD_NUMBER"); fi
          node scripts/build-server-image.mjs --prebuilt --registry "$SERVER_IMAGE" "${tags[@]}" "${push[@]}" "${number[@]}"
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_NUMBER: ${{ inputs.build-number }}
