# The quality gate, `pnpm run check`, split into parallel jobs. Each job runs one of
# the scripts `check` chains, so the two cannot drift apart. Pull requests run it
# directly; the Pages workflow calls it with the production site settings and deploys
# only after every job here passes. Beside its gate script, the server job publishes the
# multiplayer server's Docker image, which the Pages workflow promotes to :production.
name: Code quality

on:
  pull_request:
  workflow_call:
    inputs:
      deploy-base:
        description: Build the site with this DEPLOY_BASE and upload it as the Pages artifact.
        type: string
        default: ""
      multiplayer-url:
        description: VITE_MULTIPLAYER_URL for the Pages build.
        type: string
        default: ""
      build-number:
        description: >-
          The Pages workflow's run number, which the page and the server image report as
          their build. Pull requests have none.
        type: string
        default: ""
    outputs:
      server-image:
        description: The server image this commit built or found, tagged with its server build.
        value: ${{ jobs.server.outputs.image }}

permissions:
  contents: read

jobs:
  site:
    name: Site (format, Wasm, types, Vite, lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: site
          wasm-bindgen: "true"
      - if: ${{ !inputs.deploy-base }}
        run: pnpm run check:site
      - if: inputs.deploy-base
        run: pnpm run check:site
        env:
          DEPLOY_BASE: ${{ inputs.deploy-base }}
          VITE_MULTIPLAYER_URL: ${{ inputs.multiplayer-url }}
          SLOPPY_BUILD_NUMBER: ${{ inputs.build-number }}
      - if: inputs.deploy-base
        uses: actions/configure-pages@v6
      - if: inputs.deploy-base
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  clippy:
    name: Rust format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: clippy
      - run: pnpm run check:rust-lint

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: rust-tests
      - run: pnpm run test:rust

  # Builds the static musl server binary once: the page-shell tests drive it, and the
  # server image (Dockerfile) copies it in. The image is pushed as <server build>, plus
  # pr-<number> for a pull request, or main and sha-<commit> for main. A server build the
  # registry already holds is only retagged, after main's first build of it stamps its
  # build number (scripts/build-server-image.mjs). Nothing here moves :production or touches a
  # server; fork pull requests, which cannot push, only build.
  server:
    name: Server build, page-shell tests and image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      SLOPPY_SERVER_VPS: "1"
      SERVER_IMAGE: ghcr.io/vladf1/sloppy-tanks-server
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: server-image
      - run: pnpm run check:server
      - name: Log in to the GitHub Container Registry
        if: env.PUSH == 'true'
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: Build and push the server image
        id: image
        run: |
          if [ "$EVENT" = pull_request ]; then
            tags=(--tag "pr-$PR_NUMBER")
          else
            tags=(--tag main --tag "sha-${GITHUB_SHA::12}")
          fi
          push=()
          if [ "$PUSH" = true ]; then push=(--push); fi
          number=()
          if [ -n "$BUILD_NUMBER" ]; then number=(--build-number "$BUILD_NUMBER"); fi
          node scripts/build-server-image.mjs --registry "$SERVER_IMAGE" "${tags[@]}" "${push[@]}" "${number[@]}"
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_NUMBER: ${{ inputs.build-number }}
