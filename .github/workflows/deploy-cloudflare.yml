name: Deploy parallel Cloudflare site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      # The shared VPS game server (scripts/vps-host.mjs). Game changes on main need a
      # matching `npm run vps:deploy`, or players are told to reload.
      VITE_MULTIPLAYER_URL: wss://45-63-56-58.sslip.io
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build:cloudflare
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b49a59dfb5edf913223ad13eeab8d740
          wranglerVersion: "4.136.3"
          command: pages deploy dist-cloudflare --project-name sloppy-tanks --branch main
