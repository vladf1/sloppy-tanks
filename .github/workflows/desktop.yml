# The desktop app (crates/desktop): lint and test it on macOS beside the builds of
# the Apple silicon app (zipped and as an installer package), the Windows executable and
# the iPhone and iPad app for Xcode's simulators through `scripts/build-desktop.mjs`,
# uploaded as this run's artifacts. Linux CI (check.yml) leaves the crate out, since its
# window, audio and GPU dependencies need system libraries there.
# Run by hand on main (`gh workflow run desktop.yml --ref main`), it also builds the iOS
# and macOS apps for the App Store and uploads them to App Store Connect, where TestFlight
# offers them to testers once Apple has processed them, for now without multiplayer
# (`--single-player`).
# They are signed with the App Store certificates and profiles in the repository's
# secrets (APP_STORE_CERTIFICATES, a base64 .p12 with the Apple Distribution and 3rd Party
# Mac Developer Installer identities, and its APP_STORE_CERTIFICATES_PASSWORD;
# IOS_APP_STORE_PROFILE and MAC_APP_STORE_PROFILE, the base64 profiles), uploaded with the
# notarization key below and numbered with this workflow's run number. Without those
# secrets the job uploads nothing.
# Builds carry the three-part release and the commit: the fourth part is the Pages
# workflow's run number, which this workflow does not have.
# On main the macOS app and package are signed with the Developer ID certificates and
# notarized with the App Store Connect API key in the repository's secrets
# (MACOS_CERTIFICATES, a base64 .p12 with both identities, and its
# MACOS_CERTIFICATES_PASSWORD; NOTARY_API_KEY, the .p8's text, NOTARY_API_KEY_ID and
# NOTARY_API_ISSUER), and the builds replace the repository's latest release, whose
# file names stay the same so its download links do too. Pull requests sign ad hoc and
# publish nothing.
name: Apps

on:
  pull_request:
    paths: &paths
      - "crates/**"
      - "public/**"
      - "assets/desktop/**"
      - "Cargo.*"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "scripts/build-desktop.mjs"
      - "scripts/generate-desktop-icon.mjs"
      - "scripts/content-version.mjs"
      - "scripts/release-version.mjs"
      - "package.json"
      - ".github/actions/setup/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-check:
    name: macOS clippy and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: desktop-macos-check
          node-dependencies: "false"
      - run: cargo clippy --locked --profile desktop-check -p sloppy-desktop --all-targets -- -D warnings
      - run: cargo test --locked --profile desktop-check -p sloppy-desktop
      # The renderer's and the engine API's desktop-only modules build only with their
      # `native` feature, which the Linux test run leaves off.
      - run: cargo test --locked --profile desktop-check -p sloppy-render -p sloppy-web --features sloppy-render/native,sloppy-web/native --lib

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          # Step-level profile overrides are not visible when setup hashes the cache.
          cargo-cache: desktop-macos-${{ github.event_name == 'pull_request' && 'thin-16' || 'fat-1' }}
          node-dependencies: "false"
      - name: Signing keychain
        if: github.event_name != 'pull_request'
        env:
          CERTIFICATES: ${{ secrets.MACOS_CERTIFICATES }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          if [ -z "$CERTIFICATES" ]; then
            echo "No signing secrets: the app is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATES" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" \
            -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if [ -n "$NOTARY_KEY" ]; then
            printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            echo "SLOPPY_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - run: node scripts/build-desktop.mjs --mac
        env:
          # PR artifacts favor compile time; main/local builds retain release's fat LTO.
          CARGO_PROFILE_DESKTOP_LTO: ${{ github.event_name == 'pull_request' && 'thin' || 'fat' }}
          CARGO_PROFILE_DESKTOP_CODEGEN_UNITS: ${{ github.event_name == 'pull_request' && '16' || '1' }}
          SLOPPY_NOTARY_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.NOTARY_API_KEY_ID || '' }}
          SLOPPY_NOTARY_ISSUER: ${{ github.event_name != 'pull_request' && secrets.NOTARY_API_ISSUER || '' }}
      # The build falls back to an ad-hoc signature without the secrets; a release must
      # not. A stapled ticket means Developer ID signing and notarization both happened.
      - name: Check the notarization
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          xcrun stapler validate "artifacts/desktop/Sloppy Tanks.app"
          xcrun stapler validate artifacts/desktop/Sloppy-Tanks-*-macOS.pkg
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/desktop/Sloppy-Tanks-*-macOS.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/desktop/Sloppy-Tanks-*-macOS.pkg
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-timings-macos
          path: target/cargo-timings/
          if-no-files-found: ignore
      - name: Remove the signing keychain
        if: always() && github.event_name != 'pull_request'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

  ios:
    name: iOS app (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: ios-simulator-${{ github.event_name == 'pull_request' && 'thin-16' || 'fat-1' }}
          node-dependencies: "false"
      # The iOS targets stay out of rust-toolchain.toml, which is part of the content
      # version; the build script adds its own, and clippy needs the simulator's first.
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo clippy --locked --profile desktop-check --target aarch64-apple-ios-sim -p sloppy-desktop --all-targets -- -D warnings
      - run: node scripts/build-desktop.mjs --ios-simulator
        env:
          CARGO_PROFILE_DESKTOP_LTO: ${{ github.event_name == 'pull_request' && 'thin' || 'fat' }}
          CARGO_PROFILE_DESKTOP_CODEGEN_UNITS: ${{ github.event_name == 'pull_request' && '16' || '1' }}
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/ios-simulator/Sloppy-Tanks-*-iOS-Simulator.zip
          archive: false
          if-no-files-found: error

  testflight:
    name: ${{ matrix.name }} (TestFlight)
    # Only builds whose shell passed its lints and tests reach testers. Uploads are run by
    # hand (Run workflow on main), so pushes to main do not wait for Apple's processing.
    needs: [macos-check, ios]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS app
            platform: ios
            profile-secret: IOS_APP_STORE_PROFILE
            profile-variable: SLOPPY_IOS_PROFILE
            cargo-cache: ios-device-fat-1
          # Built for macOS 12 (MACOSX_DEPLOYMENT_TARGET), unlike the macOS app's job.
          - name: macOS app
            platform: mac
            profile-secret: MAC_APP_STORE_PROFILE
            profile-variable: SLOPPY_MAC_PROFILE
            cargo-cache: mac-app-store-fat-1
    steps:
      - name: Signing keychain
        id: signing
        env:
          CERTIFICATES: ${{ secrets.APP_STORE_CERTIFICATES }}
          CERTIFICATES_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATES_PASSWORD }}
          PROFILE: ${{ secrets[matrix.profile-secret] }}
          PROFILE_VARIABLE: ${{ matrix.profile-variable }}
          API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          if [ -z "$CERTIFICATES" ] || [ -z "$PROFILE" ] || [ -z "$API_KEY" ]; then
            echo "::notice::No App Store signing secrets: nothing goes to TestFlight."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATES" | base64 --decode > "$RUNNER_TEMP/app-store.p12"
          security import "$RUNNER_TEMP/app-store.p12" -k "$keychain" \
            -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/app-store.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app-store-profile"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/app-store-connect.p8"
          {
            echo "$PROFILE_VARIABLE=$RUNNER_TEMP/app-store-profile"
            echo "SLOPPY_NOTARY_KEY=$RUNNER_TEMP/app-store-connect.p8"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.signing.outputs.ready == 'true'
      - uses: ./.github/actions/setup
        if: steps.signing.outputs.ready == 'true'
        with:
          cargo-cache: ${{ matrix.cargo-cache }}
          node-dependencies: "false"
      # The desktop profile keeps release's fat LTO. The script waits until Apple has
      # processed the build and fails if Apple finds it invalid. The App Store's first
      # release is single player: online rooms and their player names come later.
      - run: node scripts/build-desktop.mjs --${{ matrix.platform }} --app-store --single-player --upload
        if: steps.signing.outputs.ready == 'true'
        env:
          SLOPPY_APP_STORE_BUILD: ${{ github.run_number }}
          SLOPPY_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          SLOPPY_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.ready == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/app-store-profile" "$RUNNER_TEMP/app-store-connect.p8"

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cargo-cache: desktop-windows-${{ github.event_name == 'pull_request' && 'thin-16' || 'fat-1' }}
          node-dependencies: "false"
      - run: node scripts/build-desktop.mjs --windows
        env:
          CARGO_PROFILE_DESKTOP_LTO: ${{ github.event_name == 'pull_request' && 'thin' || 'fat' }}
          CARGO_PROFILE_DESKTOP_CODEGEN_UNITS: ${{ github.event_name == 'pull_request' && '16' || '1' }}
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/desktop/sloppy-tanks.exe
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-timings-windows
          path: target/cargo-timings/
          if-no-files-found: ignore

  release:
    name: Latest release
    needs: [macos-check, macos, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      # skip-decompress keeps the Mac zip as the zip players download.
      - uses: actions/download-artifact@v8
        with:
          path: downloads
          pattern: "{Sloppy-Tanks-*-macOS.zip,Sloppy-Tanks-*-macOS.pkg,sloppy-tanks.exe}"
          merge-multiple: true
          skip-decompress: true
      - name: Publish the builds
        run: |
          version="$(node -p 'require("./package.json").version')"
          commit="${GITHUB_SHA::7}"
          tag="desktop-v$version-$commit"
          mkdir release
          cp downloads/Sloppy-Tanks-*-macOS.pkg release/Sloppy-Tanks-macOS.pkg
          cp downloads/Sloppy-Tanks-*-macOS.zip release/Sloppy-Tanks-macOS.zip
          cp downloads/sloppy-tanks.exe release/Sloppy-Tanks-Windows.exe
          cat > notes.md <<NOTES
          Sloppy Tanks $version for the desktop, built from $commit on main.

          - **macOS** (Apple silicon, macOS 11 or newer): \`Sloppy-Tanks-macOS.pkg\` installs the app in Applications, and \`Sloppy-Tanks-macOS.zip\` holds the app itself. Both are signed and notarized.
          - **Windows** (64-bit Windows 10 or newer): \`Sloppy-Tanks-Windows.exe\` runs as it is. It is unsigned, so SmartScreen asks once: **More info**, then **Run anyway**.

          Multiplayer needs the game version the servers run: when an update reaches them, download the new release.
          NOTES
          # A re-run of this commit replaces its own release.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" release/* --target "$GITHUB_SHA" --latest \
            --title "Sloppy Tanks $version desktop ($commit)" --notes-file notes.md
          # One release at a time: the one just published replaces the ones before it.
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep '^desktop-v' | grep -vx "$tag" |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
