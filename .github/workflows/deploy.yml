name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The whole quality gate (check.yml), whose site job also builds the Pages artifact
  # in parallel with the Rust jobs. Running it on main also saves the Cargo caches
  # that pull requests restore.
  check:
    uses: ./.github/workflows/check.yml
    with:
      # The repository's Pages custom domain, sloppy-tanks.fridman.me, serves the site at
      # its root; fridman.me/sloppy-tanks/ redirects there.
      deploy-base: /
      # The shared VPS game server (scripts/vps-host.mjs). Game changes on main need a
      # matching `pnpm run server:deploy`, or players are told to reload.
      multiplayer-url: wss://sloppy-tanks-server.fridman.me

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
