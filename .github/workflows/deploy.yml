name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # The whole quality gate (check.yml), whose site job also builds the site
  # in parallel with the Rust jobs. Running it on main also saves the Cargo caches
  # that pull requests restore.
  check:
    uses: ./.github/workflows/check.yml
    # The server job pushes its image to the GitHub Container Registry.
    permissions:
      contents: read
      packages: write
    with:
      # sloppytanks.com serves the site at its root.
      deploy-base: /
      # The server directory and its production servers (DIRECTORY_URL in
      # scripts/servers.mjs; a test keeps the two equal). Game changes on main need the
      # server to run this commit's image (promote-server below), or players are told to
      # reload.
      directory-url: https://directory.sloppytanks.com
      server-environment: production
      # The build number players and /health see: this workflow's run number, which
      # GitHub increments on every run (a re-run keeps it).
      build-number: ${{ github.run_number }}

  # The production Worker at sloppytanks.com, hosted like the dev site: precompressed
  # engines and immutable /assets/. The redirect Worker sends www.sloppytanks.com and
  # the old sloppy-tanks.fridman.me there.
  deploy:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/lint/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - run: node deploy/site/precompress.mjs dist
      - name: Deploy the site and redirect Workers
        run: |
          pnpm exec wrangler deploy --config deploy/site/production.wrangler.jsonc \
            --message "Production build ${{ github.run_number }} (${GITHUB_SHA::7})"
          pnpm exec wrangler deploy --config deploy/site/redirect.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # After the site is live, point :production at this commit's server image. The VPS
  # pulls it on `pnpm run server:update`, or by itself when auto-update is on
  # (crates/server/README.md); nothing here connects to the server.
  promote-server:
    needs: [check, deploy]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Point :production at this commit's server image
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker buildx imagetools create --tag ghcr.io/vladf1/sloppy-tanks-server:production "$IMAGE"
        env:
          IMAGE: ${{ needs.check.outputs.server-image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
