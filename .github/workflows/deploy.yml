name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # The whole quality gate (check.yml), whose site job also builds the site
  # in parallel with the Rust jobs. Running it on main also saves the Cargo caches
  # that pull requests restore.
  check:
    uses: ./.github/workflows/check.yml
    # The server job pushes its image to the GitHub Container Registry.
    permissions:
      contents: read
      packages: write
    with:
      # sloppytanks.com serves the site at its root.
      deploy-base: /
      # The server directory and its production servers (DIRECTORY_URL in
      # scripts/servers.mjs; a test keeps the two equal). Game changes on main need the
      # server to run this commit's image (promote-server below), or players are told to
      # reload.
      directory-url: https://directory.sloppytanks.com
      server-environment: production
      # The build number players and /health see: this workflow's run number, which
      # GitHub increments on every run (a re-run keeps it).
      build-number: ${{ github.run_number }}

  # The production Worker at sloppytanks.com, hosted like the dev site: precompressed
  # engines and immutable /assets/. The redirect Worker sends www.sloppytanks.com and
  # the old sloppy-tanks.fridman.me there.
  deploy:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Wrangler runs on Node (tools/deploy/README.md); `bun run wrangler` installs it.
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - run: bun deploy/site/precompress.mjs dist
      - name: Deploy the site and redirect Workers
        run: |
          bun run wrangler deploy --config deploy/site/production.wrangler.jsonc \
            --message "Production build ${{ github.run_number }} (${GITHUB_SHA::7})"
          bun run wrangler deploy --config deploy/site/redirect.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # After the site is live, add this commit's server image to the versions :production
  # lists. The machines start it by themselves when auto-update is on, or on
  # `bun run server:update` (crates/server/README.md); nothing here connects to them.
  promote-server:
    needs: [check, deploy]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Add this commit's server image to :production
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          bun scripts/promote-server.mjs production "$IMAGE"
        env:
          IMAGE: ${{ needs.check.outputs.server-image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
