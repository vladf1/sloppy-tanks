name: Set up the build toolchains
description: >-
  Bun, the Rust toolchain pinned in rust-toolchain.toml (with its wasm32 and
  musl targets), optionally the matching wasm-bindgen CLI, and this job's Cargo cache.
inputs:
  cargo-cache:
    description: >-
      Name of this job's Cargo cache. Jobs that compile different profiles or targets
      keep separate caches, including profile overrides supplied after setup. A pull
      request can restore main's cache only when it uses the same compiler settings.
    required: true
  wasm-bindgen:
    description: Install the wasm-bindgen CLI, which only the Wasm engine build needs.
    default: "false"
  js-dependencies:
    description: Install the page's JavaScript dependencies; desktop packaging only needs Bun.
    default: "true"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - uses: actions/cache@v5
      if: inputs.js-dependencies == 'true'
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    # rustup reads the channel, components and targets from rust-toolchain.toml.
    - name: Install the pinned Rust toolchain
      shell: bash
      run: |
        rustup toolchain install
        active="$(rustup show active-toolchain)"
        echo "$active"
        active="${active%% *}"
        # rust-cache hashes every installed compiler. An unused toolchain in a new
        # runner image must not invalidate the pinned compiler's dependency cache.
        # These are ephemeral CI runners; keep the pinned toolchain as their default.
        rustup default "$active"
        while read -r toolchain _; do
          if [ "$toolchain" != "$active" ]; then
            rustup toolchain uninstall "$toolchain"
          fi
        done < <(rustup toolchain list --quiet)
    # Caches from main are visible to every pull request with matching settings.
    # Desktop PRs use a separate ThinLTO cache: their first run seeds it, and later
    # pushes restore it from the same PR. A run saves only when it missed an exact
    # key. The action skips root Cargo.toml (and ignores `key` beside `shared-key`),
    # so include its hash in the shared key. Otherwise a profile change would restore
    # incompatible builds, rebuild every crate, and never save the new outputs.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cargo-cache }}-${{ hashFiles('Cargo.toml') }}
        cache-bin: false
    # The CLI must match the wasm-bindgen crate pin in Cargo.toml.
    - name: Cache wasm-bindgen-cli
      if: inputs.wasm-bindgen == 'true'
      id: wasm-bindgen
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: wasm-bindgen-cli-0.2.129-${{ runner.os }}-${{ runner.arch }}
    - name: Install wasm-bindgen-cli
      if: inputs.wasm-bindgen == 'true' && steps.wasm-bindgen.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --bin wasm-bindgen
    - run: bun install --frozen-lockfile
      if: inputs.js-dependencies == 'true'
      shell: bash
