name: Set up the build toolchains
description: >-
  Node and pnpm, the Rust toolchain pinned in rust-toolchain.toml (with its wasm32 and
  musl targets), optionally the matching wasm-bindgen CLI, and this job's Cargo cache.
inputs:
  cargo-cache:
    description: >-
      Name of this job's Cargo cache. Jobs that compile different profiles or targets
      keep separate caches; a pull request job restores the one its job saved on main.
    required: true
  wasm-bindgen:
    description: Install the wasm-bindgen CLI, which only the Wasm engine build needs.
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          tools/lint/pnpm-lock.yaml
    # rustup reads the channel, components and targets from rust-toolchain.toml.
    - name: Install the pinned Rust toolchain
      shell: bash
      run: |
        rustup toolchain install
        rustup show active-toolchain
    # Caches from main are visible to every pull request, so main's deploy run, which
    # runs these same jobs, keeps them warm. A run saves only when it missed an exact
    # key (a Cargo.lock, manifest or toolchain change). The action leaves [profile]
    # sections out of its key, so `key` adds the root manifest and Cargo config: a profile
    # or rustflags change would otherwise restore stale builds, rebuild every crate, and
    # never save.
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cargo-cache }}
        key: ${{ hashFiles('Cargo.toml', '.cargo/config.toml') }}
        cache-bin: false
    # The CLI must match the wasm-bindgen crate pin in Cargo.toml.
    - name: Cache wasm-bindgen-cli
      if: inputs.wasm-bindgen == 'true'
      id: wasm-bindgen
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: wasm-bindgen-cli-0.2.129-${{ runner.os }}-${{ runner.arch }}
    - name: Install wasm-bindgen-cli
      if: inputs.wasm-bindgen == 'true' && steps.wasm-bindgen.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --bin wasm-bindgen
    - run: pnpm install --frozen-lockfile
      shell: bash
