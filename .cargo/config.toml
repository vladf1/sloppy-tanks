[target.wasm32-unknown-unknown]
# Match the previous Rapier package, which enabled 128-bit WebAssembly SIMD.
rustflags = ["-C", "target-feature=+simd128"]

[target.x86_64-unknown-linux-musl]
# The VPS server is a static musl binary linked by Rust's bundled lld, so building it
# on macOS needs no cross toolchain (the server has no C dependencies).
linker = "rust-lld"
