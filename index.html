<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="A tank game with destructible cover, team battles and solo survival."
    />
    <meta name="theme-color" content="#0d1b2a" />
    <link rel="icon" href="/favicon.svg" />
    <!-- Added to a Home Screen, the game opens as an app of its own, without the browser's
         address bar. The manifest's relative URLs follow whatever base the site has. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sloppy Tanks" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Sloppy Tanks</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a1527;
      }
      /* winit appends the shell's canvas; it fills the page and takes the keys. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <noscript>This game needs JavaScript enabled to load the arena.</noscript>
    <!-- The desktop app's egui shell built for the page (`pnpm run wasm`): on WebGPU, or
         its WebGL2 build where the browser gives no WebGPU adapter (`?webgl` forces it;
         the WebGPU build reloads with it when its engine cannot start after all).
         It fetches the textures from the site beside this page. -->
    <script type="module">
      const forceWebgl = new URLSearchParams(location.search).has("webgl");
      const adapter =
        !forceWebgl && navigator.gpu && (await navigator.gpu.requestAdapter().catch(() => null));
      const { default: init } = adapter
        ? await import("/src/generated/shell/sloppy-tanks.js")
        : await import("/src/generated/shell-webgl/sloppy-tanks-webgl.js");
      init();
    </script>
  </body>
</html>
