<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d1b2a" />
    <link rel="icon" href="/favicon.svg" />
    <!-- Added to a Home Screen, the game opens as an app of its own, without the browser's
         address bar. The manifest's relative URLs follow whatever base the site has. The
         status bar keeps its own strip: under a translucent one, iOS 27 leaves the app a
         status bar's height short at the bottom. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sloppy Tanks" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Sloppy Tanks · Little tanks. Big mess.</title>
    <!-- Phones play the limited touch edition (src/game/phone-mode.ts). The screen's
         shorter side, not the viewport, so rotating the phone keeps the same mode. A
         phone's page never zooms: a stray double tap or pinch would leave the thumb
         controls off screen with no button to undo it. An iPhone's browser cannot hide
         its own bars for a page, so Battle Setup suggests the Home Screen instead. -->
    <script>
      {
        const homeScreenApp =
          navigator.standalone || matchMedia("(display-mode: standalone)").matches;
        if (homeScreenApp) {
          document.documentElement.classList.add("home-screen-app");
        }
        if (
          new URLSearchParams(location.search).has("phone") ||
          (matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 600)
        ) {
          document.documentElement.classList.add("phone");
          if (/iPhone|iPod/.test(navigator.userAgent) && !homeScreenApp) {
            document.documentElement.classList.add("offer-home-screen");
          }
          document
            .querySelector('meta[name="viewport"]')
            .setAttribute(
              "content",
              "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover",
            );
        }
      }
    </script>
    <!-- Inline startup styles are generated by Vite. -->
  </head>
  <body>
    <div id="app"><!-- battle-setup --></div>
    <noscript>This game needs JavaScript enabled to load the arena.</noscript>
    <!-- startup-script -->
  </body>
</html>
