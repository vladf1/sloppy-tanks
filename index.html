<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#163b5c" />
    <link rel="icon" href="/favicon.svg" />
    <title>Sloppy Tanks · Little tanks. Big mess.</title>
    <style>
      html {
        background: #163b5c;
      }
      /* Keep the startup screen independent of the deferred game stylesheet. */
      #loading,
      #loading * {
        box-sizing: border-box;
        font-synthesis: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        background: #163b5c;
        color: #f5faff;
        font:
          16px Arial,
          sans-serif;
        transition: opacity 180ms ease-out;
      }
      #loading.leaving {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #loading {
          transition: none;
        }
      }
      #loading h1 {
        margin: 0;
        font:
          900 44px/0.95 Impact,
          sans-serif;
        letter-spacing: -0.4px;
      }
      #loading p {
        margin: 0;
        color: #c4dfef;
        font:
          400 14px/normal Arial,
          sans-serif;
      }
      #loading button {
        margin-top: 12px;
        padding: 12px 24px;
        border: 0;
        border-radius: 6px;
        background: #e1f79a;
        color: #192a28;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status" aria-live="polite">
      <h1>SLOPPY TANKS</h1>
      <p>Opening the garage…</p>
      <noscript>This game needs JavaScript enabled to load the arena.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
