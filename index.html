<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="A tank game with destructible cover, team battles and solo survival."
    />
    <meta name="theme-color" content="#0d1b2a" />
    <link rel="icon" href="/favicon.svg" />
    <!-- Added to a Home Screen, the game opens as an app of its own, without the browser's
         address bar. The manifest's relative URLs follow whatever base the site has. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sloppy Tanks" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Sloppy Tanks · Little tanks. Big mess.</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #070f1d;
      }
      /* winit appends the shell's canvas; it fills the page and takes the keys. On a
         touch screen fingers drive the game: no scrolling, zooming, selection, callout
         or tap flash. Its height follows a phone browser's bars as they show and hide
         (`dvh`), so the drive stick never sits under them. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        outline: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The loading view, painted with the page's first bytes and kept over the canvas
         until the shell has shown its first frame (`data-shell` on the root,
         crates/desktop/src/page.rs): Battle Setup's dusk sky and the logo, with what is
         loading and, when it fails, why. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 34px;
        padding: 24px;
        color: #f4f9ff;
        font:
          13px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background:
          radial-gradient(ellipse 80% 80% at 50% 50%, transparent 55%, #02050bcc 100%),
          radial-gradient(ellipse 55% 30% at 50% 66%, #ffb35c55, transparent 70%),
          radial-gradient(ellipse 90% 45% at 50% 70%, #ff7a3d2e, transparent 75%),
          radial-gradient(ellipse 70% 60% at 50% 0%, #1d3f7a66, transparent 70%),
          linear-gradient(#060c1a, #0f2347 42%, #2a3d6b 60%, #5a4a6a 70%, #1a2338 78%, #070f1d);
        transition:
          opacity 0.25s,
          display 0.25s allow-discrete;
      }
      /* Its sky fades out over the game, which takes the taps and clicks meanwhile; the
         logo and the card go at once, or they would ghost over Battle Setup. */
      [data-shell="ready"] #boot {
        display: none;
        opacity: 0;
        pointer-events: none;
      }
      [data-shell="ready"] #boot > * {
        visibility: hidden;
      }
      .boot-brand {
        display: grid;
        justify-items: center;
        color: #fff;
        font:
          400 clamp(32px, 9vw, 44px) / 0.82 Impact,
          Haettenschweiler,
          "Arial Narrow Bold",
          sans-serif;
        letter-spacing: 0.5px;
        text-shadow:
          0 3px 0 #0b1a30,
          0 6px 18px #000a;
        transform: rotate(-4deg) skewX(-6deg);
      }
      .boot-brand b {
        font-weight: 400;
      }
      .boot-brand b:last-child {
        color: #ffcf38;
        font-size: 1.52em;
        text-shadow:
          0 3px 0 #7a4a0a,
          0 6px 22px #ff9d1c55;
      }
      .boot-card {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        width: min(380px, calc(100vw - 48px));
        padding: 13px 16px 14px;
        border: 1px solid #8bb9dc29;
        border-radius: 10px;
        background: #0b1d36e6;
      }
      .boot-card p {
        margin: 0;
      }
      #boot-status {
        position: relative;
        padding-left: 16px;
        color: #ffcf38;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.4px;
        font-variant-numeric: tabular-nums;
      }
      #boot-status::before {
        content: "";
        position: absolute;
        left: 0;
        top: calc(0.725em - 4px);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 3px #ffcf3826;
      }
      .boot-track {
        height: 4px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 4px;
        background: #88b9dc1a;
      }
      #boot-bar {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #ffcf38, #ffe58a);
        box-shadow: 0 0 10px #ffcf3899;
        animation: boot-sweep 1.4s ease-in-out infinite;
      }
      #boot[data-progress] #boot-bar {
        background: linear-gradient(90deg, #ffcf38, #ffe58a);
        animation: none;
        transition: width 0.15s;
      }
      @keyframes boot-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(365%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-bar {
          width: 100%;
          opacity: 0.65;
          animation: none;
        }
      }
      .boot-card .boot-more {
        margin-top: 10px;
        color: #a9c0d8;
        font-size: 12px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      #boot-note {
        max-height: 30vh;
        overflow-y: auto;
        color: #f4f9ff;
      }
      /* The game's gold action (`.primary`, as Battle Setup's TRY AGAIN): a lit slab with
         a ledge under it and a warm glow, brighter and lifted under the pointer, a glint
         crossing it once, pressed down onto a thinner ledge. */
      #boot-retry {
        position: relative;
        display: block;
        width: 100%;
        min-height: 62px;
        margin-top: 14px;
        padding: 8px 24px;
        overflow: hidden;
        border: 0;
        border-radius: 12px;
        color: #1a2233;
        background: linear-gradient(180deg, #ffe46e 0%, #ffcf38 48%, #f4a91a 100%);
        box-shadow:
          inset 0 1px #fff9,
          inset 0 -3px #c97d0e,
          0 8px 24px #ffb21c33;
        text-shadow: 0 1px #fff6;
        font:
          400 16px/1 Impact,
          Haettenschweiler,
          "Arial Narrow Bold",
          sans-serif;
        letter-spacing: 4px;
        cursor: pointer;
        transition:
          filter 0.12s,
          transform 0.12s,
          box-shadow 0.12s;
      }
      #boot-retry::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -40%;
        width: 30%;
        background: linear-gradient(90deg, transparent, #ffffff8c, transparent);
        transform: skewX(-20deg) translateX(-120%);
        pointer-events: none;
      }
      #boot-retry:hover {
        filter: brightness(1.07);
        box-shadow:
          inset 0 1px #fff9,
          inset 0 -3px #c97d0e,
          0 10px 30px #ffb21c66;
        transform: translateY(-1px);
      }
      #boot-retry:hover::after {
        transform: skewX(-20deg) translateX(560%);
        transition: transform 0.6s ease;
      }
      #boot-retry:active {
        transform: translateY(1px);
        box-shadow:
          inset 0 1px #fff9,
          inset 0 -1px #c97d0e,
          0 4px 12px #ffb21c44;
      }
      #boot-retry:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      [data-shell="failed"] #boot-status {
        color: #ffb2a7;
      }
      [data-shell="failed"] #boot-status::before {
        box-shadow: 0 0 0 3px #ffb2a720;
      }
      /* The track stays, under the words and filled with the failure's colour. */
      [data-shell="failed"] .boot-track {
        order: 1;
      }
      [data-shell="failed"] #boot-retry {
        order: 2;
      }
      /* Its `display` would otherwise show it while the game still loads. */
      #boot-retry[hidden] {
        display: none;
      }
      [data-shell="failed"] #boot-bar {
        width: 100%;
        background: #ffb2a7;
        box-shadow: none;
        opacity: 1;
        animation: none;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-brand" aria-hidden="true"><b>SLOPPY</b><b>TANKS</b></div>
      <div class="boot-card" role="status">
        <p id="boot-status">Loading game…</p>
        <div class="boot-track"><span id="boot-bar"></span></div>
        <p id="boot-note" class="boot-more" hidden></p>
        <p id="boot-hint" class="boot-more" hidden></p>
        <noscript><p class="boot-more">This game needs JavaScript enabled.</p></noscript>
        <button id="boot-retry" type="button" hidden>TRY AGAIN</button>
      </div>
    </div>
    <!-- An opt-in trace for devices with no inspector at hand: `?trace` turns it on for
         this browser (`?trace=off` off). Each second, and at every GPU, network or page
         event, it notes what the page does in `localStorage`, which outlives a page the
         system killed, and uploads the notes to the directory's `/traces`. -->
    <script>
      (() => {
        const FLAG = "sloppy-trace";
        const NOTES = "sloppy-trace-notes";
        const MAX_NOTES = 600;
        const TRACES = "https://directory.sloppytanks.com/traces";
        const query = new URLSearchParams(location.search);
        try {
          if (query.has("trace")) {
            if (query.get("trace") === "off") localStorage.removeItem(FLAG);
            else localStorage.setItem(FLAG, String(Date.now()));
          }
          if (!localStorage.getItem(FLAG)) return;
        } catch {
          return;
        }
        const id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
        let notes = [];
        try {
          notes = JSON.parse(localStorage.getItem(NOTES) ?? "[]");
        } catch {}
        const started = performance.timeOrigin;
        const gpu = { devices: 0, buffers: 0, textures: 0, peak: 0, lost: [] };
        let wasm;
        const note = (kind, detail = "") => {
          const at = new Date().toISOString().slice(11, 23);
          notes.push(`${at} ${kind} ${String(detail).slice(0, 600)}`);
          if (notes.length > MAX_NOTES) notes.splice(0, notes.length - MAX_NOTES);
        };
        const save = () => {
          try {
            localStorage.setItem(NOTES, JSON.stringify(notes));
          } catch {}
        };
        const upload = () =>
          fetch(`${TRACES}?id=${id}`, {
            method: "POST",
            body: notes.join("\n"),
            keepalive: true,
          }).catch(() => {});
        const mb = (bytes) => (bytes / 1e6).toFixed(1);
        note(
          "load",
          `${location.href} ${innerWidth}x${innerHeight}@${devicePixelRatio} ${navigator.userAgent}`,
        );
        // The previous load's notes go up first: it may have ended without a word.
        upload();

        for (const name of ["instantiateStreaming", "instantiate"]) {
          const original = WebAssembly[name];
          WebAssembly[name] = async (...args) => {
            const result = await original.apply(WebAssembly, args);
            const instance = result.instance ?? result;
            for (const value of Object.values(instance.exports ?? {})) {
              if (value instanceof WebAssembly.Memory) wasm = value;
            }
            return result;
          };
        }
        const bytesPerTexel = (format) =>
          /32float|32uint|32sint/.test(format) && /rgba/.test(format)
            ? 16
            : /rgba16|rg32|depth32float-stencil8/.test(format)
              ? 8
              : /^r8|stencil8$/.test(format)
                ? 1
                : /^rg8|r16|depth16/.test(format)
                  ? 2
                  : 4;
        if (globalThis.GPUAdapter) {
          const requestDevice = GPUAdapter.prototype.requestDevice;
          GPUAdapter.prototype.requestDevice = async function (...options) {
            const device = await requestDevice.apply(this, options);
            const number = ++gpu.devices;
            note("gpu-device", `#${number} ${JSON.stringify(this.info ?? {})}`);
            device.lost.then((info) => {
              gpu.lost.push(number);
              note("gpu-lost", `#${number} ${info.reason} "${info.message}"`);
              save();
              upload();
            });
            device.addEventListener("uncapturederror", (event) =>
              note(
                "gpu-error",
                `#${number} ${event.error?.constructor?.name} ${event.error?.message}`,
              ),
            );
            const track = (kind, bytes, object, label) => {
              gpu[kind] += bytes;
              gpu.peak = Math.max(gpu.peak, gpu.buffers + gpu.textures);
              if (bytes >= 8e6) note(`gpu-${kind}`, `#${number} ${label} ${mb(bytes)} MB`);
              const destroy = object.destroy.bind(object);
              let live = true;
              object.destroy = () => {
                if (live) gpu[kind] -= bytes;
                live = false;
                destroy();
              };
              return object;
            };
            const createBuffer = device.createBuffer.bind(device);
            device.createBuffer = (d) => track("buffers", d.size, createBuffer(d), d.label);
            const createTexture = device.createTexture.bind(device);
            device.createTexture = (d) => {
              const [w, h = 1, l = 1] = Array.isArray(d.size)
                ? d.size
                : [d.size.width, d.size.height, d.size.depthOrArrayLayers];
              let texels = 0;
              for (let m = 0; m < (d.mipLevelCount ?? 1); m++) {
                texels += Math.max(1, w >> m) * Math.max(1, h >> m) * l;
              }
              const bytes = texels * bytesPerTexel(d.format) * (d.sampleCount ?? 1);
              const label = `${d.label} ${w}x${h}x${l} ${d.format} x${d.sampleCount ?? 1}`;
              return track("textures", bytes, createTexture(d), label);
            };
            const destroyDevice = device.destroy.bind(device);
            device.destroy = () => {
              note("gpu-destroy", `#${number}`);
              destroyDevice();
            };
            return device;
          };
        }
        const NativeSocket = WebSocket;
        window.WebSocket = class extends NativeSocket {
          constructor(...args) {
            super(...args);
            const url = String(args[0]).replace(/\?.*/, "");
            note("socket", `open ${url}`);
            this.addEventListener("open", () => note("socket", `opened ${url}`));
            this.addEventListener("close", (event) =>
              note("socket", `closed ${url} ${event.code} ${event.reason}`),
            );
            this.addEventListener("error", () => note("socket", `error ${url}`));
          }
        };
        const consoleError = console.error.bind(console);
        console.error = (...args) => {
          note("console-error", args.map(String).join(" "));
          save();
          consoleError(...args);
        };
        addEventListener("error", (event) =>
          note("error", `${event.message} ${event.error?.stack ?? ""}`),
        );
        addEventListener("unhandledrejection", (event) =>
          note(
            "rejection",
            `${event.reason?.message ?? event.reason} ${event.reason?.stack ?? ""}`,
          ),
        );
        addEventListener("sloppy:failed", (event) => {
          note("failed", event.detail);
          save();
          upload();
        });
        addEventListener("visibilitychange", () => note("visibility", document.visibilityState));
        addEventListener("pagehide", () => {
          note("pagehide");
          save();
          upload();
        });
        new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (entry.name.startsWith("sloppy:")) note("mark", entry.name);
          }
        }).observe({ type: "mark", buffered: true });
        let seconds = 0;
        setInterval(() => {
          const canvas = document.querySelector("canvas");
          note(
            "tick",
            [
              `t=${Math.round((Date.now() - started) / 1000)}s`,
              `shell=${document.documentElement.dataset.shell ?? "-"}`,
              `wasm=${wasm ? mb(wasm.buffer.byteLength) : "-"}MB`,
              `gpu=${mb(gpu.buffers)}+${mb(gpu.textures)}MB peak=${mb(gpu.peak)}`,
              `devices=${gpu.devices} lost=${gpu.lost.join(",") || "-"}`,
              `canvas=${canvas ? `${canvas.width}x${canvas.height}` : "-"}`,
              document.visibilityState,
            ].join(" "),
          );
          save();
          if (++seconds % 5 === 0) upload();
        }, 1000);
      })();
    </script>
    <!-- The desktop app's egui shell built for the page (`pnpm run wasm`): on WebGPU, or
         its WebGL2 build where the browser gives no WebGPU adapter (`?webgl` forces it;
         the WebGPU build reloads with it when its engine cannot start after all). Only
         the chosen build's glue and binary download (a browser with WebGPU starts on
         that build while it looks for an adapter); the binary streams into its
         instance while the loading view counts its bytes, and the files the shell takes
         from the page download beside it. The shell then fetches the textures from the
         site beside this page and tells the page how it goes
         (crates/desktop/src/page.rs). Marks for the measurements: `sloppy:boot`,
         `sloppy:downloaded` and `sloppy:shell-started` here, then the shell's. -->
    <script type="module">
      import webgpuBinary from "/src/generated/shell/sloppy-tanks_bg.wasm?url";
      import webglBinary from "/src/generated/shell-webgl/sloppy-tanks-webgl_bg.wasm?url";
      import webgpuShaders from "/src/generated/shaders/webgpu.json?url";
      import webglShaders from "/src/generated/shaders/webgl.json?url";
      import { startGeometryCache } from "/src/geometry-cache.ts";

      performance.mark("sloppy:boot");
      // A returning visit's cached vehicles and scenery read meanwhile (geometry-cache.ts).
      startGeometryCache();
      const root = document.documentElement;
      const view = document.getElementById("boot");
      const status = document.getElementById("boot-status");
      const bar = document.getElementById("boot-bar");
      const note = document.getElementById("boot-note");
      const hint = document.getElementById("boot-hint");
      const retry = document.getElementById("boot-retry");
      retry.addEventListener("click", () => location.reload());

      /** Loading that says nothing new for this long offers a retry. */
      const STALL_MS = 20000;
      let stall;
      const show = (element, text) => {
        element.textContent = text;
        element.hidden = !text;
      };
      let failed = false;
      const say = (line) => {
        if (failed) return;
        status.textContent = line;
        clearTimeout(stall);
        stall = setTimeout(() => {
          if (!root.dataset.shell) {
            show(hint, "This is taking longer than usual.");
            retry.hidden = false;
          }
        }, STALL_MS);
      };

      const OFFLINE = "Check your connection, then try again.";
      const OLD_BROWSER = "Update your browser, or try another one.";
      const GRAPHICS = /\b(WebGPU|WebGL) (adapter|device|canvas|window) unavailable/;
      const UNLOADED = "The arena could not load. Please try again.";
      /** Say why the game cannot go on, with a retry; the first reason stands. A `detail`
       * the player cannot act on (a browser's own error) goes to the console and to
       * `#boot-note`'s `data-detail` for the checks, with `headline` (or the usual
       * heading) and no `reason` shown in its place. */
      const fail = (reason, help, { headline, detail } = {}) => {
        if (failed) return;
        failed = true;
        clearTimeout(stall);
        root.dataset.shell = "failed";
        if (detail) console.error(detail);
        note.dataset.detail = detail ?? reason;
        status.textContent =
          headline ??
          (performance.getEntriesByName("sloppy:first-frame").length
            ? "Sloppy Tanks stopped"
            : "Sloppy Tanks could not start");
        status.parentElement.setAttribute("role", "alert");
        show(note, reason);
        delete view.dataset.progress;
        bar.style.width = "";
        const graphics =
          "Turn on hardware acceleration in your browser's settings, or try another browser.";
        show(hint, help ?? (GRAPHICS.test(reason) ? graphics : "Reload to try again."));
        retry.hidden = false;
        // Enter retries, without a ring that would read as the button being chosen.
        retry.focus({ focusVisible: false });
      };
      /** The game's code or binary did not arrive: production's words, the detail kept. */
      const unloaded = (detail) => fail("", OFFLINE, { headline: UNLOADED, detail });
      const message = (error) => (error instanceof Error ? error.message : String(error));
      // The shell's own word (a panic, no graphics), or a trap that stopped it without
      // one (out of memory). So does a browser error thrown through the shell's Wasm
      // frames (`wasm-function[n]` in every engine's stack): it skips Rust's cleanup and
      // leaves the shell mid-event, drawing no further frame.
      addEventListener("sloppy:failed", (event) => fail(String(event.detail)));
      const THROUGH_WASM = /wasm-function\[/;
      const trapped = (error) => {
        if (
          error instanceof WebAssembly.RuntimeError ||
          (error instanceof Error && THROUGH_WASM.test(error.stack ?? ""))
        ) {
          fail(`The game stopped: ${error.message}`);
        }
      };
      addEventListener("error", (event) => trapped(event.error));
      addEventListener("unhandledrejection", (event) => trapped(event.reason));

      /** Fetch `url` and count its `bytes` in the loading view as the response streams;
       * `complete` settles on whether every byte came. `signal` drops it. */
      const download = async (url, bytes, signal) => {
        const response = await fetch(url, { signal });
        if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
        // A compressed response's length is not what it delivers (vite.config.ts).
        const total =
          bytes ||
          (!response.headers.has("content-encoding") &&
            Number(response.headers.get("content-length"))) ||
          0;
        const megabytes = (count) => (count / 1e6).toFixed(1);
        const of = total ? ` of ${megabytes(total)}` : "";
        if (total) view.dataset.progress = "";
        const reader = response.clone().body.getReader();
        const complete = (async () => {
          let received = 0;
          for (let chunk; !(chunk = await reader.read()).done;) {
            received += chunk.value.byteLength;
            say(`Downloading the game… ${megabytes(received)}${of} MB`);
            if (total) bar.style.width = `${Math.min(100, (100 * received) / total)}%`;
          }
          performance.mark("sloppy:downloaded");
          delete view.dataset.progress;
          bar.style.width = "";
          say("Starting the engine…");
          return received >= total;
        })().catch(() => false);
        return { response, complete };
      };

      // Safari starts an AudioContext made outside a gesture suspended, and the shell makes
      // its sound on the frame after GO (audio.rs): resume each on the player's next press,
      // as the old page's Howler did.
      const AudioContext = window.AudioContext ?? window.webkitAudioContext;
      if (AudioContext) {
        const contexts = [];
        window.AudioContext = class extends AudioContext {
          constructor(...options) {
            super(...options);
            contexts.push(this);
          }
        };
        const resume = () => {
          for (const context of contexts) if (context.state === "suspended") context.resume();
        };
        for (const type of ["pointerdown", "pointerup", "keydown", "touchend"]) {
          addEventListener(type, resume, { capture: true });
        }
      }

      // The runtime files under content-hashed names that browsers keep across releases
      // (scripts/hashed-assets.ts): the renderer resolves texture paths through
      // `sloppyAssets`. The fonts, sounds and Battle Setup's previews download beside the
      // binary, which downloads again with every release, into `sloppyFiles` for the
      // shell (crates/desktop/src/assets.rs): each its download, then its bytes, or null
      // once it failed. The fonts must be there before the shell starts; the previews
      // and sounds may come late, so they leave the bandwidth to the binary.
      const assets = (globalThis.sloppyAssets = JSON.parse(
        document.getElementById("sloppy-assets")?.textContent || "{}",
      ));
      const files = (globalThis.sloppyFiles = {});
      const fetchFile = async (path, priority) => {
        try {
          const response = await fetch(assets[path], { priority });
          if (!response.ok) throw new Error(`HTTP ${response.status} for ${assets[path]}`);
          files[path] = new Uint8Array(await response.arrayBuffer());
        } catch (error) {
          files[path] = null;
          throw error;
        }
      };
      const fonts = [];
      for (const path of Object.keys(assets)) {
        if (path.startsWith("fonts/")) {
          fonts.push((files[path] = fetchFile(path, "high")));
        } else if (/^(audio|previews)\//.test(path)) {
          files[path] = fetchFile(path, "low").catch((error) =>
            console.warn(`${path} did not download: ${message(error)}`),
          );
        }
      }

      // The shader stages the chosen build draws, generated with it (pnpm run wasm,
      // crates/render/src/shader/tables.rs): they download beside the binary and stay
      // here as `sloppyShaders`, from which the renderer reads one stage at a time.
      const shaderTables = async (url) => {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
        return response.json();
      };

      // The shell bakes generated textures in workers that run its module (bakes.rs),
      // with the glue the page loaded (`glueUrl`, set once it has).
      let glueUrl;
      window.sloppyBakeWorker = () => {
        const worker = new Worker(new URL("/src/bake-worker.ts", import.meta.url), {
          type: "module",
        });
        worker.postMessage({ glue: glueUrl });
        return worker;
      };

      if (typeof WebAssembly !== "object") {
        fail("This browser cannot run WebAssembly.", OLD_BROWSER);
      } else {
        say("Loading game…");
        const forceWebgl = new URLSearchParams(location.search).has("webgl");
        const [webgpuBytes, webglBytes] = (
          document.querySelector('meta[name="sloppy-shell-bytes"]')?.content ?? ""
        )
          .split(",")
          .map(Number);
        const webglBuild = () => [
          import("/src/shell-glue-webgl.ts"),
          download(webglBinary, webglBytes),
          shaderTables(webglShaders),
        ];
        // A browser with WebGPU nearly always gives an adapter, but asking takes a while
        // (a cold WebKit spends 75 ms starting its GPU process at the first read of
        // `navigator.gpu`), so the WebGPU build downloads meanwhile and gives way to the
        // WebGL build only when no adapter comes. `in` does not read the property.
        let glue, binary, shaders;
        if (!forceWebgl && "gpu" in navigator) {
          const dropped = new AbortController();
          glue = import("/src/shell-glue.ts");
          binary = download(webgpuBinary, webgpuBytes, dropped.signal);
          shaders = shaderTables(webgpuShaders);
          if (!(await navigator.gpu.requestAdapter().catch(() => null))) {
            dropped.abort();
            for (const unused of [glue, binary, shaders]) unused.catch(() => {});
            [glue, binary, shaders] = webglBuild();
          }
        } else {
          [glue, binary, shaders] = webglBuild();
        }
        let init, response, complete;
        try {
          [{ default: init, glueUrl }, { response, complete }] = await Promise.all([
            glue.catch((error) => {
              throw new Error(`The game's code did not load: ${message(error)}`);
            }),
            binary.catch((error) => {
              throw new Error(`The game did not download: ${message(error)}`);
            }),
            Promise.all(fonts).catch((error) => {
              throw new Error(`The game's fonts did not download: ${message(error)}`);
            }),
            shaders.catch((error) => {
              throw new Error(`The game's shaders did not download: ${message(error)}`);
            }),
          ]);
          globalThis.sloppyShaders = await shaders;
        } catch (error) {
          unloaded(message(error));
        }
        if (init) {
          try {
            await init({ module_or_path: response });
            performance.mark("sloppy:shell-started");
          } catch (error) {
            if (!(await complete)) {
              unloaded(`The game did not download completely: ${message(error)}`);
            } else if (error instanceof WebAssembly.CompileError) {
              fail("This browser cannot run the game.", OLD_BROWSER, {
                detail: `This browser cannot run the game: ${error.message}`,
              });
            } else if (error instanceof WebAssembly.RuntimeError) {
              trapped(error);
            } else {
              // An exception in its start, or a binary from another build (a stale cache).
              fail("", undefined, { detail: `The game could not start: ${message(error)}` });
            }
          }
        }
      }
    </script>
  </body>
</html>
