[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/web", "crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
sloppy-core = { path = "crates/core" }
# Each binary picks its graphics backend through `sloppy-web`'s `webgpu`/`webgl` features.
sloppy-render = { path = "crates/render", default-features = false }
rapier3d = { version = "=0.36.0" }
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "=30.0.0", default-features = false, features = ["wgsl"] }
glow = "=0.17.0"
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
# Native multiplayer server (crates/server).
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
sha1_smol = "1"
getrandom = "0.4"
libc = "0.2"

# The browser build: small, whole-program optimized, no unwinding tables. Most code is
# optimized for size; the physics crates run every frame, so they keep "s" (measured: an
# all-"z" build simulated the 30-tank Scrap Yard 60% slower, while this mix matches
# all-"s" speed with a 6% smaller gzip download). The renderer is optimized for speed:
# at 3 rather than "s" its frame took 8-16% less CPU in the village and on the Stress
# Grid on both engines, for 30-40 KB (3%) more brotli download.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.rapier3d]
opt-level = "s"

[profile.release.package.parry3d]
opt-level = "s"

[profile.release.package.nalgebra]
opt-level = "s"

[profile.release.package.simba]
opt-level = "s"

[profile.release.package.wide]
opt-level = "s"

[profile.release.package.sloppy-render]
opt-level = 3

# The native multiplayer server favors speed and keeps unwinding, so one room's
# panic can be contained without ending every other room in the process.
[profile.server]
inherits = "release"
opt-level = 3
panic = "unwind"
strip = false

[profile.server.package.rapier3d]
opt-level = 3

[profile.server.package.parry3d]
opt-level = 3

[profile.server.package.nalgebra]
opt-level = 3

[profile.server.package.simba]
opt-level = 3

[profile.server.package.wide]
opt-level = 3


# Debug builds keep only line tables: panic backtraces still name file and line, while
# full debug info made Linux test builds link 2-3x slower and the target dir 4x larger.
[profile.dev]
debug = "line-tables-only"

# Physics tests run natively in debug; optimize dependencies so seeded matches finish quickly.
# Dependencies carry no debug info; their frames still show function names.
[profile.dev.package."*"]
opt-level = 2
debug = false
