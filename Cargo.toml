[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/web", "crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
sloppy-core = { path = "crates/core" }
sloppy-render = { path = "crates/render" }
rapier3d = { version = "=0.36.0" }
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "=30.0.0", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

# The browser build: small, whole-program optimized, no unwinding tables.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The native multiplayer server favors speed and keeps unwinding, so one room's
# panic can be contained without ending every other room in the process.
[profile.server]
inherits = "release"
opt-level = 3
panic = "unwind"
strip = false

# Physics tests run natively in debug; optimize dependencies so seeded matches finish quickly.
[profile.dev.package."*"]
opt-level = 2
