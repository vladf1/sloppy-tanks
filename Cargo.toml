[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/render",
    "crates/web",
    "crates/server",
    "crates/desktop",
    "crates/pilot",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
sloppy-core = { path = "crates/core" }
# Each binary picks its graphics backend through `sloppy-web`'s `webgpu`/`webgl` features.
sloppy-render = { path = "crates/render", default-features = false }
rapier3d = { version = "=0.36.0" }
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "=30.0.0", default-features = false, features = ["wgsl"] }
glow = "=0.17.0"
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
# Native multiplayer server (crates/server).
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
hyper = { version = "1.11", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
sha1_smol = "1"
getrandom = "0.4"
libc = "0.2"
# Outbound HTTPS to the server directory in pure Rust: the static musl binary links with
# rust-lld (no C toolchain) and its image has no CA certificates, so it bundles its roots.
rustls = { version = "0.23.27", default-features = false, features = ["std"] }
# Pure Rust with runtime CPU detection: graviola needed ADX, which the VPS vCPUs (Haswell) lack.
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"

# The browser build: small, whole-program optimized, no unwinding tables. Most code is
# optimized for size; the physics crates run every frame, so they keep "s" (measured: an
# all-"z" build simulated the 30-tank Scrap Yard 60% slower, while this mix matches
# all-"s" speed with a 6% smaller gzip download). The renderer is optimized for speed:
# at 3 rather than "s" its frame took 8-16% less CPU in the village and on the Stress
# Grid on both engines, for 30-40 KB (3%) more brotli download.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.rapier3d]
opt-level = "s"

[profile.release.package.parry3d]
opt-level = "s"

[profile.release.package.nalgebra]
opt-level = "s"

[profile.release.package.simba]
opt-level = "s"

[profile.release.package.wide]
opt-level = "s"

[profile.release.package.sloppy-render]
opt-level = 3

# The native multiplayer server favors speed and keeps unwinding, so one room's
# panic can be contained without ending every other room in the process. Thin LTO over
# 16 codegen units rather than release's fat LTO in one rebuilt the musl server after a
# server-only change in about 6 s instead of 35, and a room's server work
# (capture_benchmark) stayed within noise: +1% on an M-series Mac, +0.9% ± 8% on the
# dev VPS.
[profile.server]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = false

[profile.server.package.rapier3d]
opt-level = 3

[profile.server.package.parry3d]
opt-level = 3

[profile.server.package.nalgebra]
opt-level = 3

[profile.server.package.simba]
opt-level = 3

[profile.server.package.wide]
opt-level = 3

# The page's Wasm while an agent or a person iterates on how something looks
# (`pnpm run wasm:fast`): built for compile time, not size or speed. Release's per-package
# overrides carry over, so the cached physics and render crates stay as they are; what an
# edit recompiles, the shell and the crates it changed, skips LTO and splits into many
# code units. Never deployed: `build`, `build:dev` and `check` build release. Measure
# performance on release.
[profile.wasm-fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256

# The desktop app (crates/desktop, `pnpm run desktop`) downloads once, so all of it is
# optimized for speed. Release's per-package overrides carry over and outrank `"*"`,
# hence the physics crates are named again.
[profile.desktop]
inherits = "release"
opt-level = 3

[profile.desktop.package."*"]
opt-level = 3

[profile.desktop.package.rapier3d]
opt-level = 3

[profile.desktop.package.parry3d]
opt-level = 3

[profile.desktop.package.nalgebra]
opt-level = 3

[profile.desktop.package.simba]
opt-level = 3

[profile.desktop.package.wide]
opt-level = 3

# Desktop shell tests exercise input, menus, audio decisions and sockets, not long
# physics matches. Do not optimize its entire GPU/window/audio dependency graph just
# to run them; clippy and tests share this profile in CI.
[profile.desktop-check]
inherits = "dev"

[profile.desktop-check.package."*"]
opt-level = 0

# Debug builds keep only line tables: panic backtraces still name file and line, while
# full debug info made Linux test builds link 2-3x slower and the target dir 4x larger.
[profile.dev]
debug = "line-tables-only"

# Physics tests run natively in debug; optimize dependencies so seeded matches finish quickly.
# Dependencies carry no debug info; their frames still show function names.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The pilot engine for the bots Worker (`pnpm run pilot:build`). The download size that
# release's fat LTO buys does not matter in a Worker, while its link took ~40 s of every
# build: without LTO, the dependencies compile once and stay cached, so a pilot change
# rebuilds in ~2 s and a core change in ~23 s instead of ~45 s (4 cores). Eight pilots
# measured the same CPU either way (about 60 ms per pilot-second, three alternating runs
# each in Node), for a 2.7 MB module instead of 2.5 MB.
[profile.pilot]
inherits = "release"
lto = false
codegen-units = 16
