<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tank preview renderer</title>
  </head>
  <body>
    <p id="status">Rendering…</p>
    <script type="module">
      // Renders the tank selection previews for scripts/generate-previews.mjs, which
      // reads `window.tankPreviewAssets` (or `window.tankPreviewError`).
      import { renderTankPreviews } from "./tank-previews";
      try {
        window.tankPreviewAssets = await renderTankPreviews();
        document.querySelector("#status").textContent = "Done";
      } catch (error) {
        window.tankPreviewError = String(error?.stack ?? error);
        document.querySelector("#status").textContent = window.tankPreviewError;
      }
    </script>
  </body>
</html>
