<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Map scene checks</title>
    <style>
      body {
        margin: 0;
        background: #142e39;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      aside {
        position: fixed;
        bottom: 12px;
        left: 12px;
        max-width: 850px;
        padding: 12px;
        background: #132936eb;
        color: #fff;
        font: 13px sans-serif;
      }
      button {
        margin: 3px;
        padding: 8px;
      }
      output {
        display: block;
        margin-top: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <aside>
      <div>
        Harbor Havoc:
        <button id="overview">Overview</button>
        <button id="dock">Dock close-up</button>
        <button id="berth">Side berth & water</button>
        <button id="cargo">Cargo close-up</button>
        <button id="crate-stages">Crate damage stages</button>
        <button id="crate-hit">Hit middle crate</button>
      </div>
      <div>
        Dusty Dig:
        <button id="quarry">Overview</button>
        <button id="rocks">Sandstone & crates</button>
        <button id="barriers">Dragon’s teeth</button>
        <button id="steel">Steel barrier</button>
        <button id="excavator">Excavator</button>
        <button id="truck">Haul truck</button>
        <button id="break">Break shortcut crates</button>
      </div>
      <div>
        Checks:
        <button id="checks">Map switches and resets</button>
        <button id="water-checks">Both water reflections</button>
      </div>
      <output id="result">Loading…</output>
    </aside>
    <script type="module" src="./maps.browser.js"></script>
  </body>
</html>
