<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sloppy Tanks destruction checks</title>
    <style>
      body {
        margin: 0;
        background: #a9997b;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      aside {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 12px;
        background: #17242bec;
        color: white;
        font: 13px sans-serif;
      }
      button {
        padding: 8px;
        margin: 3px;
      }
      output {
        display: block;
        white-space: pre-wrap;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <aside>
      <button id="reset">Reset showcase</button>
      <button id="break">Break scenery</button>
      <button id="step">Advance one second</button>
      <button id="shot">Shoot concrete</button>
      <button id="blast">Blast concrete</button>
      <button id="steel">Blast hedgehog</button>
      <button id="wreck">Land a wreck</button>
      <button id="chain">Drum beside wreck</button>
      <output>Loading…</output>
    </aside>
    <script type="module" src="./destruction.browser.js"></script>
  </body>
</html>
