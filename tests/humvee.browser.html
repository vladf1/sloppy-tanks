<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.svg" />
    <title>HUNTER HMMWV visual check</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #a9997b;
      }
      canvas {
        display: block;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      button {
        margin-top: 8px;
        padding: 5px 9px;
        cursor: pointer;
      }
      aside {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 2;
        padding: 12px 16px;
        border: 1px solid #ffffff38;
        border-radius: 8px;
        background: #17242eee;
        color: white;
        font:
          700 13px/1.4 ui-monospace,
          monospace;
        letter-spacing: 0.08em;
      }
      aside small {
        display: block;
        margin-top: 4px;
        color: #b6c7cc;
        font:
          11px/1.4 system-ui,
          sans-serif;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <aside>
      HUNTER // TOW HUMVEE<small>Drag to orbit · Scroll to zoom · Right-drag to pan</small>
      <button id="reset-view" type="button">Reset view</button>
    </aside>
    <script type="module">
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import RAPIER from "@dimforge/rapier3d-compat";
      import { loadTankSurface } from "../src/game/tank-surfaces";
      import { Presentation } from "../src/game/presentation";
      import { Simulation } from "../src/game/simulation";

      await RAPIER.init();
      await loadTankSurface();
      const simulation = new Simulation(123);
      for (const cover of simulation.covers) simulation.world.removeRigidBody(cover.body);
      simulation.covers = [];
      simulation.movableCovers = [];
      simulation.coverByCollider.clear();
      simulation.pickups = [];
      const hunters = simulation.tanks.filter((tank) => tank.kind === "humvee");
      const heavy = simulation.tanks.find((tank) => tank.kind === "heavy");
      const show = [...hunters, heavy].filter(Boolean);
      const poses = [
        [-3.4, 0, 0.05],
        [3.4, 0, -0.05],
        [0, -6, Math.PI],
      ];
      for (const tank of simulation.tanks) {
        const index = show.indexOf(tank);
        tank.alive = index >= 0;
        if (index < 0) continue;
        const [x, z, aim] = poses[index];
        tank.hp = simulation.maxHealth(tank);
        tank.protection = 0;
        tank.heading = index ? -0.35 : 0.35;
        tank.aim = aim;
        tank.body.setTranslation({ x, y: 0.65, z }, true);
        tank.body.setRotation(
          { x: 0, y: Math.sin(tank.heading / 2), z: 0, w: Math.cos(tank.heading / 2) },
          true,
        );
        tank.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
        tank.previous = { x, z };
      }
      simulation.match.phase = "paused";

      const view = await Presentation.create(document.querySelector("canvas"));
      view.reset(simulation);
      view.render(simulation, 1, 0, false);
      for (const bar of view.bars.values()) bar.visible = false;
      // Keep the inspection camera separate from the gameplay follow camera.
      const camera = view.camera.clone();
      camera.position.set(8, 9, 13);
      const controls = new OrbitControls(camera, view.renderer.domElement);
      controls.target.set(0, 0.7, 0.5);
      controls.enableDamping = true;
      controls.minDistance = 4;
      controls.maxDistance = 45;
      controls.maxPolarAngle = Math.PI / 2 - 0.03;
      controls.update();
      controls.saveState();
      document.querySelector("#reset-view").addEventListener("click", () => controls.reset());
      function draw() {
        controls.update();
        view.renderer.render(view.scene, camera);
        requestAnimationFrame(draw);
      }
      draw();
      addEventListener("resize", () => {
        view.resize();
        camera.aspect = view.camera.aspect;
        camera.updateProjectionMatrix();
      });
    </script>
  </body>
</html>
