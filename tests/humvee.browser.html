<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.svg" />
    <title>HUNTER HMMWV visual check</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #a9997b;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      button {
        margin-top: 8px;
        padding: 5px 9px;
        cursor: pointer;
      }
      aside {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 2;
        padding: 12px 16px;
        border: 1px solid #ffffff38;
        border-radius: 8px;
        background: #17242eee;
        color: white;
        font:
          700 13px/1.4 ui-monospace,
          monospace;
        letter-spacing: 0.08em;
      }
      aside small {
        display: block;
        margin-top: 4px;
        color: #b6c7cc;
        font:
          11px/1.4 system-ui,
          sans-serif;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <aside>
      HUNTER // TOW HUMVEE<small>Drag to orbit · Scroll to zoom · Right-drag to pan</small>
      <button id="reset-view" type="button">Reset view</button>
    </aside>
    <script type="module" src="./humvee.browser.js"></script>
  </body>
</html>
