<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tank suspension checks</title>
    <style>
      body {
        margin: 0;
        background: #163b5c;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      aside {
        position: fixed;
        left: 16px;
        top: 16px;
        padding: 12px;
        color: white;
        background: #142e4df2;
        font: 14px Arial;
        max-width: 350px;
        border-radius: 8px;
      }
      button,
      select {
        padding: 7px;
        margin: 3px;
      }
      label {
        display: block;
        margin: 6px 0;
      }
      p {
        font-size: 12px;
        line-height: 1.5;
        color: #c4dfef;
      }
      output {
        display: block;
        white-space: pre-wrap;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <aside>
      <strong>Suspension live preview</strong>
      <p>Actual game motion, shown close up. Slow playback makes the small lean easier to see.</p>
      <label
        >Tank
        <select id="chassis">
          <option value="scout">Skipper</option>
          <option value="balanced" selected>Bruiser</option>
          <option value="heavy">Big Rig</option>
        </select></label
      >
      <label
        >Playback
        <select id="speed">
          <option value="1">Normal speed</option>
          <option value="0.5">Half speed</option>
          <option value="0.25">Quarter speed</option>
        </select></label
      >
      <button id="demo">Loop demo</button>
      <button id="pause">Pause</button><br />
      <button id="accelerate">Accelerate</button>
      <button id="brake">Brake</button>
      <button id="turn">Turn</button>
      <br /><button id="checks">Run checks</button>
      <output id="result">Loading…</output>
    </aside>
    <script type="module" src="./suspension.browser.js"></script>
  </body>
</html>
