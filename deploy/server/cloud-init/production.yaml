#cloud-config
# Vultr startup script (cloud-init user data) for a production game server: deploy an
# Ubuntu instance with it and the machine sets itself up (deploy/server/bootstrap.sh),
# then lists itself in the server directory under production.
write_files:
  - path: /etc/sloppy-tanks/server.env
    content: |
      SERVER_ENVIRONMENT=production
      DIRECTORY_URL=https://sloppy-tanks-directory.fridman.me
runcmd:
  - [bash, -c, "curl -fsSL --retry 5 https://raw.githubusercontent.com/vladf1/sloppy-tanks/main/deploy/server/bootstrap.sh | bash"]
