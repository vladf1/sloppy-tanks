#cloud-config
# Vultr startup script (cloud-init user data) for the App Store candidate game server:
# deploy an Ubuntu instance with it and the machine sets itself up
# (deploy/server/bootstrap.sh), then lists itself in the server directory under app-store,
# where the App Store apps look. It follows :app-store-candidate, the server of the latest
# builds uploaded to TestFlight, so testers and App Review play a version online before
# its release, while the machines on :app-store keep serving the released one: an app joins
# only servers of its own content version.
write_files:
  - path: /etc/sloppy-tanks/server.env
    content: |
      SERVER_ENVIRONMENT=app-store
      SERVER_IMAGE_TAG=app-store-candidate
      DIRECTORY_URL=https://directory.sloppytanks.com
runcmd:
  - curl -fsSL --retry 5 https://raw.githubusercontent.com/vladf1/sloppy-tanks/main/deploy/server/bootstrap.sh | bash
