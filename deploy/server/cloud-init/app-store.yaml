#cloud-config
# Vultr startup script (cloud-init user data) for an App Store game server: deploy an
# Ubuntu instance with it and the machine sets itself up (deploy/server/bootstrap.sh),
# then lists itself in the server directory under app-store, where the App Store apps look.
# It follows :app-store, the released apps' content version (`bun run server:release-app`).
write_files:
  - path: /etc/sloppy-tanks/server.env
    content: |
      SERVER_ENVIRONMENT=app-store
      DIRECTORY_URL=https://directory.sloppytanks.com
runcmd:
  - curl -fsSL --retry 5 https://raw.githubusercontent.com/vladf1/sloppy-tanks/main/deploy/server/bootstrap.sh | bash
